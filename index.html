<style>
:root {
  color-scheme: light;
  --paper: #f5f2e9;
  --blue: #0751dc;
  --pink: #f32e91;
  --yellow: #ffe000;
  --ink: #101010;
  --cyan: #26c9f5;
  --surface: #ebe7dc;
  --muted: #66645e;
  --border: #10101020;
  --pattern: #11111114;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #101010;
  --ink: #f5f2e9;
  --surface: #1b1b1b;
  --muted: #aaa69d;
  --border: #ffffff20;
  --pattern: #ffffff12;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  transition: background-color .45s, color .45s;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: .10;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
}

::selection {
  background: var(--pink);
  color: white;
}

.display {
  font-family: 'Anton', sans-serif;
  line-height: .81;
  letter-spacing: -.045em;
}

.marker {
  font-family: 'Permanent Marker', cursive;
}

.paper {
  background-color: var(--paper);
  background-image: radial-gradient(var(--pattern) .7px, transparent .7px);
  background-size: 5px 5px;
  transition: background-color .45s, color .45s;
}

.blue { background: var(--blue); }
.pink { background: var(--pink); }

.hero {
  min-height: 100svh;
  isolation: isolate;
}

.hero-layout {
  min-height: calc(100svh - 90px);
}

.hero-title .line {
  display: block;
  overflow: hidden;
  padding-bottom: .035em;
}

.hero-title .line > span {
  display: inline-block;
  will-change: transform;
}

.hero-title .blue-word { color: var(--blue); }
.hero-title .pink-word { color: var(--pink); }

.hero-title .marker-word {
  transform: rotate(-3deg);
}

.artwork {
  isolation: isolate;
  perspective: 1000px;
}

.art-photo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  clip-path: polygon(14% 1%, 100% 5%, 96% 92%, 7% 100%, 0 23%);
}

.art-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  filter: saturate(1.3) contrast(1.08);
  transform: scale(1.1);
}

.art-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, #003ebc70, transparent 65%);
  mix-blend-mode: multiply;
}

.sun {
  width: clamp(210px, 27vw, 380px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--yellow);
}

.tentacle {
  position: absolute;
  width: 110%;
  height: 110%;
  inset: -5%;
  pointer-events: none;
  overflow: visible;
}

.sticker {
  box-shadow: 5px 6px 0 #101010;
  transition: transform .3s ease;
}

.sticker:hover {
  transform: rotate(0deg) scale(1.07) !important;
}

.hand-arrow {
  display: inline-block;
  animation: arrowFloat 2s ease-in-out infinite;
}

@keyframes arrowFloat {
  0%,100% { transform: translate(0,0) rotate(-5deg); }
  50% { transform: translate(5px,-7px) rotate(5deg); }
}

.sun-spin {
  animation: sunSpin 35s linear infinite;
}

@keyframes sunSpin {
  to { transform: rotate(360deg); }
}

.float {
  animation: float 5s ease-in-out infinite;
}

.float-reverse {
  animation: float 7s ease-in-out infinite reverse;
}

@keyframes float {
  0%,100% { translate: 0 0; }
  50% { translate: 0 -13px; }
}

.nav-link {
  position: relative;
}

.nav-link::after {
  content: "";
  position: absolute;
  height: 2px;
  background: var(--blue);
  left: 0;
  bottom: -7px;
  width: 0;
  transition: width .25s;
}

.nav-link:hover::after { width: 100%; }

.cta {
  position: relative;
  isolation: isolate;
  transition: transform .25s, box-shadow .25s;
}

.cta:hover {
  box-shadow: 6px 6px 0 var(--ink);
}

.cta:active { transform: scale(.97); }

/* THEME TOGGLE */

.theme-toggle {
  width: 43px;
  height: 43px;
  border: 1.5px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: background .3s, color .3s, border-color .3s, transform .3s;
}

.theme-toggle:hover {
  background: var(--yellow);
  color: #101010;
  border-color: var(--yellow);
  transform: rotate(-12deg);
}

.theme-toggle svg {
  width: 18px;
  height: 18px;
  transition: transform .4s;
}

.theme-toggle:active svg {
  transform: rotate(45deg) scale(.8);
}

/* DARK THEME */

:root[data-theme="dark"] .hero-header {
  border-bottom: 1px solid var(--border);
}

:root[data-theme="dark"] .hero-header .cta {
  background: var(--yellow);
  color: #101010;
  border-color: var(--yellow);
}

:root[data-theme="dark"] .hero-header .cta:hover {
  box-shadow: 5px 5px 0 #f5f2e9;
}

:root[data-theme="dark"] .hero-description p {
  color: #d0ccc3;
}

:root[data-theme="dark"] .hero-buttons > a:nth-child(2) {
  color: var(--ink);
}

:root[data-theme="dark"] .hero-buttons > a:nth-child(2) span {
  border-color: var(--ink);
}

:root[data-theme="dark"] .hero-buttons > a:nth-child(2):hover span {
  border-color: var(--blue);
}

:root[data-theme="dark"] .hero-signature {
  color: var(--ink);
}

:root[data-theme="dark"] .hero-bottom {
  background: #050505;
}

:root[data-theme="dark"] .hero-bottom .text-white\/50 {
  color: #888 !important;
}

:root[data-theme="dark"] .cursor-dot {
  mix-blend-mode: difference;
}

:root[data-theme="dark"] .theme-toggle {
  border-color: #f5f2e9;
  color: #ffe000;
}

:root[data-theme="dark"] .theme-toggle:hover {
  color: #101010;
}

.marquee {
  display: flex;
  width: max-content;
  animation: marquee 23s linear infinite;
}

.marquee:hover { animation-play-state: paused; }

@keyframes marquee {
  to { transform: translateX(-50%); }
}

.cursor-dot {
  width: 12px;
  height: 12px;
  background: var(--pink);
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 200;
  top: 0;
  left: 0;
  transform: translate(-50%,-50%);
  mix-blend-mode: multiply;
}

.scroll-indicator {
  animation: scrollDown 1.6s ease-in-out infinite;
}

@keyframes scrollDown {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

/* MOBILE MENU */

.menu-overlay {
  transition: opacity .35s, visibility .35s;
}

@media(max-width: 1023px) {
  .hero-layout { min-height: auto; }
}

@media(max-width: 767px) {
  .hero-title {
    font-size: clamp(76px, 17vw, 145px);
  }

  .artwork { min-height: 520px; }

  .art-photo {
    clip-path: polygon(8% 0, 100% 4%, 95% 94%, 0 100%);
  }

  .theme-toggle {
    width: 40px;
    height: 40px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>

lucide.createIcons();


// ------------------------------------------------
// LIGHT / DARK THEME
// ------------------------------------------------

const themeToggle = document.querySelector('#themeToggle');
const root = document.documentElement;

function applyTheme(theme) {

  root.dataset.theme = theme;

  const isDark = theme === 'dark';

  themeToggle.setAttribute('aria-pressed', String(isDark));
  themeToggle.setAttribute(
    'aria-label',
    isDark ? 'Ativar tema claro' : 'Ativar tema escuro'
  );

  themeToggle.setAttribute(
    'title',
    isDark ? 'Mudar para Light Mode' : 'Mudar para Dark Mode'
  );

  themeToggle.innerHTML = `
    <i data-lucide="${isDark ? 'sun' : 'moon'}"></i>
  `;

  // COR DA BARRA DO NAVEGADOR
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute('content', isDark ? '#101010' : '#f5f2e9');

  // LOGO
  document.getElementById('logobrand').src =
    isDark ? 'logo-white.png' : 'logo-dark.png';

  // BACKGROUND HOME
  document.getElementById('home').style.backgroundImage =
    isDark ? 'url("1bgd.png")' : 'url("bgl.png")';

  // BACKGROUND HERO
  const hero = document.querySelector('.hero-layout');

  if (hero) {
    hero.style.backgroundImage =
      isDark ? 'url("hero-dark.png")' : 'url("hero-light.png")';
    hero.style.backgroundSize = 'cover';
    hero.style.backgroundPosition = 'center';
  }

  lucide.createIcons();

  try {
    localStorage.setItem('fisher-theme', theme);
  } catch (error) {
    console.warn('Não foi possível salvar a preferência de tema.');
  }
}

// RESTAURAR TEMA SALVO
let savedTheme = 'light';

try {
  savedTheme = localStorage.getItem('fisher-theme') || 'light';
} catch (error) {
  console.warn('Não foi possível recuperar a preferência de tema.');
}

applyTheme(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = root.dataset.theme || 'light';
  applyTheme(current === 'light' ? 'dark' : 'light');
});


// ------------------------------------------------
// MOBILE NAVIGATION
// ------------------------------------------------

const menuBtn = document.querySelector('#menuBtn');
const mobileNav = document.querySelector('#mobileNav');
const closeMenu = document.querySelector('#closeMenu');

function toggleMenu(open) {

  mobileNav.classList.toggle('invisible', !open);
  mobileNav.classList.toggle('opacity-0', !open);
  mobileNav.classList.toggle('visible', open);
  mobileNav.classList.toggle('opacity-100', open);

  menuBtn.setAttribute('aria-expanded', String(open));
  document.body.style.overflow = open ? 'hidden' : '';
}

menuBtn.addEventListener('click', () => toggleMenu(true));
closeMenu.addEventListener('click', () => toggleMenu(false));

document.querySelectorAll('.menuLink').forEach(link => {
  link.addEventListener('click', () => toggleMenu(false));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') toggleMenu(false);
});


// ------------------------------------------------
// GSAP ENTRANCE
// ------------------------------------------------

const reducedMotion = window.matchMedia(
  '(prefers-reduced-motion: reduce)'
).matches;

if (window.gsap && !reducedMotion) {

  gsap.set([
    '.intro',
    '.hero-description',
    '.hero-buttons',
    '.hero-title .line > span'
  ], { opacity: 0 });

  const tl = gsap.timeline({
    defaults: { ease: 'power4.out' }
  });

  tl.from('header', {
    y: -35,
    opacity: 0,
    duration: .8
  })
  .to('.intro', {
    opacity: 1,
    y: 0,
    duration: .6
  }, '-=.25')
  .to('.hero-title .line > span', {
    opacity: 1,
    y: 0,
    stagger: .13,
    duration: .85
  }, '-=.2')
  .to('.hero-description', {
    opacity: 1,
    x: 0,
    duration: .7
  }, '-=.4')
  .to('.hero-buttons', {
    opacity: 1,
    y: 0,
    duration: .65
  }, '-=.35')
  .from('.art-photo', {
    scale: .88,
    opacity: 0,
    duration: 1.3,
    ease: 'power3.out'
  }, '-=1')
  .from('.sun', {
    scale: .2,
    opacity: 0,
    duration: 1
  }, '-=1')
  .from('.sticker', {
    scale: 0,
    rotation: 30,
    stagger: .2,
    duration: .7
  }, '-=.7');

  gsap.to('.tentacle', {
    rotation: 3,
    yoyo: true,
    repeat: -1,
    duration: 4,
    ease: 'sine.inOut',
    transformOrigin: '50% 50%'
  });

} else {

  document.querySelectorAll(
    '.intro, .hero-description, .hero-buttons, .hero-title .line > span'
  ).forEach(el => {
    el.style.opacity = 1;
  });
}


// ------------------------------------------------
// MOUSE PARALLAX
// ------------------------------------------------

const artwork = document.querySelector('#artwork');
const photo = document.querySelector('#heroPhoto');
const tentacle = document.querySelector('#tentacle');
const sun = document.querySelector('.sun');

if (
  window.matchMedia('(hover: hover) and (pointer: fine)').matches &&
  !reducedMotion &&
  window.gsap
) {

  artwork.addEventListener('pointermove', e => {

    const rect = artwork.getBoundingClientRect();

    const x = (e.clientX - rect.left) / rect.width - .5;
    const y = (e.clientY - rect.top) / rect.height - .5;

    gsap.to(photo, {
      x: x * -15,
      y: y * -15,
      duration: .7,
      ease: 'power2.out'
    });

    gsap.to(tentacle, {
      x: x * 12,
      y: y * 12,
      rotation: x * 2,
      duration: .8,
      ease: 'power2.out'
    });

    gsap.to(sun, {
      x: x * -20,
      y: y * -20,
      duration: 1,
      ease: 'power2.out'
    });

  });

  artwork.addEventListener('pointerleave', () => {

    gsap.to([photo, tentacle, sun], {
      x: 0,
      y: 0,
      rotation: 0,
      duration: 1,
      ease: 'power3.out'
    });

  });

}


// ------------------------------------------------
// MAGNETIC CTA
// ------------------------------------------------

if (!reducedMotion && window.gsap) {

  document.querySelectorAll('.magnetic').forEach(button => {

    button.addEventListener('pointermove', e => {

      const rect = button.getBoundingClientRect();

      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;

      gsap.to(button, {
        x: x * .12,
        y: y * .12,
        duration: .3,
        ease: 'power2.out'
      });

    });

    button.addEventListener('pointerleave', () => {

      gsap.to(button, {
        x: 0,
        y: 0,
        duration: .5,
        ease: 'elastic.out(1,.4)'
      });

    });

  });

}


// ------------------------------------------------
// CUSTOM CURSOR — DESKTOP
// ------------------------------------------------

if (
  window.matchMedia('(hover: hover) and (pointer: fine)').matches &&
  !reducedMotion &&
  window.gsap
) {

  const cursor = document.createElement('div');

  cursor.className = 'cursor-dot';
  document.body.appendChild(cursor);

  window.addEventListener('pointermove', e => {

    gsap.to(cursor, {
      x: e.clientX,
      y: e.clientY,
      duration: .2,
      ease: 'power2.out'
    });

  });

  document.querySelectorAll('a, button').forEach(el => {

    el.addEventListener('mouseenter', () => {
      gsap.to(cursor, { scale: 3, duration: .2 });
    });

    el.addEventListener('mouseleave', () => {
      gsap.to(cursor, { scale: 1, duration: .2 });
    });

  });

}
